# The backend shells out to `kubectl` to provision namespaces and grade
# tasks, so its ServiceAccount needs broad write access across the cluster.
# This is intentional for a hands-on practice tool — do NOT expose the
# public endpoint without authentication (see deploy/README.md).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ckad-backend
  namespace: ckad-simulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ckad-simulator
rules:
  - apiGroups:
      - ""                      # core: pods, services, configmaps, secrets,
      - apps                    # namespaces, persistentvolumeclaims ...
      - batch                   # jobs, cronjobs
      - autoscaling             # hpa
      - networking.k8s.io       # ingresses, networkpolicies
      - policy                  # poddisruptionbudgets
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ckad-simulator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ckad-simulator
subjects:
  - kind: ServiceAccount
    name: ckad-backend
    namespace: ckad-simulator
