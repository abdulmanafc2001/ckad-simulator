apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ckad-simulator
  labels:
    app: ckad-backend
spec:
  replicas: 1                # sessions are in-memory: keep at 1
  strategy:
    type: Recreate           # avoid two writers during rollouts
  selector:
    matchLabels:
      app: ckad-backend
  template:
    metadata:
      labels:
        app: ckad-backend
    spec:
      serviceAccountName: ckad-backend
      containers:
        - name: server
          image: ghcr.io/manaf/ckad-backend:local   # overridden by kustomization
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1",  memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - { name: sandbox, mountPath: /tmp/ckad-simulator }
      volumes:
        - name: sandbox
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ckad-simulator
spec:
  selector:
    app: ckad-backend
  ports:
    - port: 8080
      targetPort: 8080
