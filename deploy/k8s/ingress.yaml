# Optional pretty ingress (managed clouds with an ingress controller).
# Apply after editing the host, then switch frontend Service to ClusterIP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ckad-simulator
  namespace: ckad-simulator
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: ckad.example.com        # <-- change me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 80 }
